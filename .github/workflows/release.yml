name: Release

# Pushing a tag like v0.1.0 builds the unsigned iOS app and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: scripts/make-ipa.sh "$RUNNER_TEMP/ipa"

      - name: Check the tag matches the app version
        run: |
          ls "$RUNNER_TEMP/ipa"
          test -f "$RUNNER_TEMP/ipa/iGreenLight-${GITHUB_REF_NAME#v}-unsigned.ipa"

      - name: Checksum
        run: |
          cd "$RUNNER_TEMP/ipa"
          shasum -a 256 *.ipa | tee SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/ipa/*.ipa "$RUNNER_TEMP"/ipa/SHA256SUMS.txt \
            --title "iGreenLight ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --generate-notes
