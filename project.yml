name: iGreenLight
options:
  bundleIdPrefix: app.igreenlight
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: XXXXXXXXXX
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  iGreenLight:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
      - Platforms/macOS/Assets.xcassets
    dependencies:
      - package: WebRTC
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: iGreenLight
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        NSMicrophoneUsageDescription: iGreenLight uses the microphone for party/game chat with your Xbox.
        NSLocalNetworkUsageDescription: iGreenLight connects directly to your Xbox on the local network for Remote Play.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
    entitlements:
      path: Resources/iGreenLight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.usb: true
        # Diagnostics are written to the real ~/Library/Application Support/iGreenLight/ (not the container) so they can be read from Terminal.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/iGreenLight/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.igreenlight.iGreenLight
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # iPhone / iPad build of the same sources. Platform differences are behind `#if os(iOS)`.
  iGreenLight-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Platforms/iOS/Assets.xcassets
    dependencies:
      - package: WebRTC
    info:
      path: Platforms/iOS/Info.plist
      properties:
        CFBundleDisplayName: iGreenLight
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        NSMicrophoneUsageDescription: iGreenLight uses the microphone for party/game chat with your Xbox.
        NSLocalNetworkUsageDescription: iGreenLight connects directly to your Xbox on the local network for Remote Play.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the stream view run at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # The log and diagnostics live in Documents, visible in the Files app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: iGreenLight
        PRODUCT_BUNDLE_IDENTIFIER: app.igreenlight.iGreenLight
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
