name: iGreenLight
options:
  bundleIdPrefix: app.igreenlight
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0
# Team and signing identity: Config/Signing.xcconfig, overridden by the untracked Config/Local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  iGreenLight:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
      - Platforms/macOS/Assets.xcassets
      # The AWDL helper's launchd job, which Settings → Network registers with SMAppService.
      - path: Platforms/macOS/LaunchDaemons
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Platforms/macOS/Scripts
        buildPhase: resources
      # Shipped in the app and shown under Settings → About.
      - path: Licenses
        type: folder
    dependencies:
      - package: WebRTC
      # Root helper that keeps AWDL off during a stream; installed by the user from Settings → Network.
      - target: awdl-helper
        embed: true
        # Not signed again on copy: that would drop the helper's own entitlements.
        codeSign: false
        copy:
          destination: executables
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: iGreenLight
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.games
        NSMicrophoneUsageDescription: iGreenLight uses the microphone for party/game chat with your Xbox.
        NSLocalNetworkUsageDescription: iGreenLight connects directly to your Xbox on the local network for Remote Play.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
    entitlements:
      path: Resources/iGreenLight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.usb: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.igreenlight.iGreenLight
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Declares RTCAudioDevice, which the macOS WebRTC framework implements but doesn't ship a header for.
        SWIFT_OBJC_BRIDGING_HEADER: Platforms/macOS/Headers/Bridging-Header.h
    scheme:
      testTargets:
        - iGreenLightTests
  awdl-helper:
    type: tool
    platform: macOS
    sources:
      - Platforms/macOS/AWDLHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.igreenlight.awdl-helper
        SKIP_INSTALL: YES
        # macOS only registers a sandboxed app's daemon if the daemon is sandboxed too.
        CODE_SIGN_ENTITLEMENTS: Platforms/macOS/AWDLHelper/awdl-helper.entitlements
        OTHER_CODE_SIGN_FLAGS: --identifier app.igreenlight.awdl-helper
        # A sandboxed tool has no bundle, so its Info.plist (the bundle identifier) goes inside the binary.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
  # Unit tests (Swift Testing), hosted in the Mac app:
  #   xcodebuild test -project iGreenLight.xcodeproj -scheme iGreenLight -derivedDataPath build
  iGreenLightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/iGreenLightTests
    dependencies:
      - target: iGreenLight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.igreenlight.iGreenLightTests
        GENERATE_INFOPLIST_FILE: YES
  # iPhone / iPad build of the same sources. Platform differences are behind `#if os(iOS)`.
  iGreenLight-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Platforms/iOS/Assets.xcassets
      - path: Licenses
        type: folder
    dependencies:
      - package: WebRTC
    info:
      path: Platforms/iOS/Info.plist
      properties:
        CFBundleDisplayName: iGreenLight
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.games
        NSMicrophoneUsageDescription: iGreenLight uses the microphone for party/game chat with your Xbox.
        NSLocalNetworkUsageDescription: iGreenLight connects directly to your Xbox on the local network for Remote Play.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the stream view run at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # The log and diagnostics live in Documents, visible in the Files app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: iGreenLight
        PRODUCT_BUNDLE_IDENTIFIER: app.igreenlight.iGreenLight
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
